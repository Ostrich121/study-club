services:
  - type: web
    name: study-club-scoreboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
