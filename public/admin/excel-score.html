<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel 上传加分</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body data-page="excel-score" data-title="Excel 上传加分" data-subtitle="支持普通名单表和活动台账表，先预览，再确认入库">
  <div id="admin-shell"></div>
  <div data-admin-content hidden>
    <section class="card">
        <div class="section-header">
          <div>
            <h2>上传 Excel 加分</h2>
            <p>支持 <span class="mono">.xlsx</span> 和 <span class="mono">.xls</span>。普通名单表会识别姓名/学号列；活动台账表会自动识别日期、活动内容、参加人员和积分情况。</p>
          </div>
        </div>
      <form id="excel-score-form">
        <div class="form-grid">
          <div class="field">
            <label for="excel-file">Excel 文件</label>
            <input id="excel-file" type="file" name="file" accept=".xlsx,.xls" />
          </div>
          <div class="field">
            <label for="excel-reason">本次加分原因</label>
            <input id="excel-reason" name="reason" placeholder="普通名单表必填；活动台账表可留空自动识别" />
          </div>
          <div class="field">
            <label for="excel-activity-date">活动时间</label>
            <input id="excel-activity-date" name="activityDate" type="date" />
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" id="excel-preview-btn" type="submit">生成预览</button>
          <button class="btn-secondary" id="excel-confirm-btn" type="button" disabled>确认加分入库</button>
        </div>
        <p class="hint">如果上传的是活动台账，系统会自动拆分“每人积1分”和“额外积1分”等规则，并为额外积分生成单独日志。</p>
      </form>
    </section>

    <section class="page-section card">
      <div class="section-header">
        <div>
          <h2>预览结果</h2>
          <p>未匹配的姓名或学号会高亮显示；如果检测到活动已导入过，确认前会再次提醒</p>
        </div>
      </div>
      <div id="excel-preview">
        <div class="empty-state">上传 Excel 后，这里会显示活动识别结果、匹配成员、未匹配成员、重复活动提醒和额外积分拆分结果。</div>
      </div>
    </section>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin-common.js"></script>
  <script src="/js/excel-score.js"></script>
</body>
</html>
